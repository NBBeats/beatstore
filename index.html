<!DOCTYPE html>

<head>

    <title>Mi Beatstore</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .beat-card { background: #1e1e1e; padding: 20px; margin: 20px auto; width: 300px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

    </style>
</head>
<body>

    <div class="beat-card">
        <h3>Beat 1 - Estilo Trap</h3>
        <audio controls>
            <!-- Aquí irá el enlace o archivo de tu beat -->

            Tu navegador no soporta el reproductor de audio.
        </audio>
    </div>

</html>
